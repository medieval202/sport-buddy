server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:sportsbuddy;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: ${JWT_SECRET:sports-buddy-2026-demo-secret-key-change-in-production}
    expiration-ms: 86400000
